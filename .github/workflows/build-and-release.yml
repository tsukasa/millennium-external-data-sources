name: Build and release

on:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install Lua
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bun run check

      - name: Backend tests
        run: lua5.4 tests/backend.test.lua

      - name: Build plugin
        run: |
          bun run relbuild
          test -s dist/io.tsukasa.external-data-sources.star

      - name: Save build artifact
        uses: actions/upload-artifact@v7
        with:
          name: external-data-sources-${{ github.run_id }}
          path: dist/io.tsukasa.external-data-sources.star
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: external-data-sources-${{ github.run_id }}
          path: dist

      - name: Publish version release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Skipping release for non-version tag: $TAG"
            exit 0
          fi

          previous_tag=""
          while IFS= read -r candidate; do
            if [[ "$candidate" == "$TAG" ]]; then
              break
            fi
            previous_tag="$candidate"
          done < <(git tag --merged "$TAG" --list 'v*' |
            grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' |
            sort -V)

          if [[ -n "$previous_tag" ]]; then
            git log --format='- %s (%h)' "$previous_tag..$TAG" > release-notes.md
          else
            git log --format='- %s (%h)' "$TAG" > release-notes.md
          fi

          gh release create "$TAG" \
            dist/io.tsukasa.external-data-sources.star \
            --verify-tag \
            --title "External Data Sources Plugin $TAG" \
            --notes-file release-notes.md
